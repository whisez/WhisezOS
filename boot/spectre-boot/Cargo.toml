[package]
name = "spectre-boot"
version.workspace = true
edition.workspace = true
license.workspace = true
autobins = false

# Stage-1 loader. Target: x86_64-unknown-uefi (PE32+ EFI application).
# Built with `cargo xtask boot`, installed to \EFI\BOOT\BOOTX64.EFI.

[dependencies]
uefi = { version = "0.39", default-features = false, features = ["alloc", "global_allocator", "panic_handler"] }
sha3 = { workspace = true }
bitflags = { workspace = true }
heapless = "0.9"

[features]
default = []
# The production loader loads and boots the real kernel; the preview is a
# separate bin that boots nothing. Keeping them apart is what lets the preview
# stay honest about being a preview.
production-loader = []

[[bin]]
name = "spectre-demo"
path = "src/demo.rs"

[[bin]]
name = "spectre-boot"
path = "src/main.rs"
required-features = ["production-loader"]

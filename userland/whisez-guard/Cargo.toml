[package]
name = "whisez-guard"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Defensive host posture, integrity, and offline file scanner for WhisezOS"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha3 = "0.12"
walkdir = "2.5"

[dev-dependencies]
tempfile = "3.20"

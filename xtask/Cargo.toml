[package]
name = "xtask"
version.workspace = true
edition.workspace = true
publish = false

# Build orchestration. `cargo xtask <cmd>` rather than a Makefile or shell
# scripts: the build has to work identically on Linux, macOS, and Windows hosts,
# and the one thing every WhisezOS developer definitely has is a Rust toolchain.

[dependencies]
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
sha3 = "0.12"

name: Özellik isteği
description: WhisezOS için odaklı ve uygulanabilir bir geliştirme önerin.
title: "[Özellik]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Proje yapım aşamasındadır. Lütfen öneriyi en küçük yararlı değişiklik
        olarak ve mevcut geliştirici önizlemesi sınırlarını dikkate alarak yazın.
  - type: textarea
    id: problem
    attributes:
      label: Çözülmesi gereken sorun
      description: Hangi sınırlamayı veya kullanıcı ihtiyacını ele almalı?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Önerilen değişiklik
      description: En küçük yararlı çözümü açıklayın.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Alan
      options:
        - UEFI önizlemesi
        - Whisez Guard
        - Çekirdek araştırması
        - Masaüstü araştırması
        - Derleme ve paketleme
        - Belgeler
    validations:
      required: true

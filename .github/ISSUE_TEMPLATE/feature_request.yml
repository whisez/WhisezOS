name: Feature request
description: Suggest a focused improvement to WhisezOS.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What limitation or user need should this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the smallest useful solution.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - UEFI preview
        - Whisez Guard
        - Kernel research
        - Desktop research
        - Build and packaging
        - Documentation
    validations:
      required: true

name: Hata bildirimi
description: WhisezOS önizlemesi veya Whisez Guard için tekrar oluşturulabilir bir hata bildirin.
title: "[Hata]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        WhisezOS'u geliştirmeye yardımcı olduğunuz için teşekkürler.
        Parola, özel dosya, erişim anahtarı veya kişisel bilgi eklemeyin.
        Projenin henüz yapım aşamasında olduğunu unutmayın.
  - type: dropdown
    id: component
    attributes:
      label: Bileşen
      options:
        - UEFI önizlemesi
        - Whisez Guard
        - Derleme araçları
        - Doğrulama testleri
        - Belgeler
        - Diğer
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Ne oldu?
      description: Gördüğünüz sonucu ve beklediğiniz davranışı açıklayın.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Tekrar oluşturma adımları
      placeholder: |
        1. ... komutunu çalıştırdım
        2. ... seçeneğini açtım
        3. ... sonucunu gördüm
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Ortam
      description: Windows, QEMU ve kullandığınız komutun sürümünü yazın.
      placeholder: Windows 11, QEMU 11, cargo xtask run
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: İlgili terminal çıktısı
      description: Önce kullanıcı adlarını, yerel yolları ve diğer kişisel bilgileri kaldırın.
      render: shell

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: nightly-2026-05-01

jobs:
  host-verification:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v6

      - name: Sabitlenmiş Rust araç zincirini kur
        shell: pwsh
        run: >-
          rustup toolchain install $env:RUST_TOOLCHAIN
          --profile minimal
          --component rustfmt
          --component clippy
          --component rust-src
          --target x86_64-unknown-uefi

      - name: Çalışan paketlerin biçimini denetle
        shell: pwsh
        run: |
          cargo +$env:RUST_TOOLCHAIN fmt -p whisez-guard -- --check
          cargo +$env:RUST_TOOLCHAIN fmt -p xtask -- --check
          cargo +$env:RUST_TOOLCHAIN fmt --manifest-path verify/Cargo.toml -- --check

      - name: Testleri, lint denetimini ve UEFI derlemesini çalıştır
        shell: pwsh
        run: cargo +$env:RUST_TOOLCHAIN xtask test

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: nightly-2026-05-01

jobs:
  host-verification:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install the pinned Rust toolchain
        shell: pwsh
        run: rustup toolchain install $env:RUST_TOOLCHAIN --profile minimal --component rustfmt

      - name: Check formatting for runnable host packages
        shell: pwsh
        run: |
          cargo +$env:RUST_TOOLCHAIN fmt -p whisez-guard -- --check
          cargo +$env:RUST_TOOLCHAIN fmt --manifest-path verify/Cargo.toml -- --check

      - name: Test Whisez Guard
        shell: pwsh
        run: cargo +$env:RUST_TOOLCHAIN test -p whisez-guard --locked

      - name: Run the host verification harness
        shell: pwsh
        run: cargo +$env:RUST_TOOLCHAIN test --manifest-path verify/Cargo.toml --locked
